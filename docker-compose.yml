# Para uso local/estudo. Nenhum segredo real deve ser commitado:
# crie um arquivo ".env" (git-ignorado) com as variáveis abaixo antes de subir os containers.
#
#   POSTGRES_PASSWORD=<senha-forte-apenas-local>
#   OPENIDDICT_SIGNING_CERT_PASSWORD=<senha-do-certificado>
#   OPENIDDICT_ENCRYPTION_CERT_PASSWORD=<senha-do-certificado>
#   ASPNETCORE_Kestrel__Certificates__Default__Password=<senha-do-certificado-https-dev>
#
# Os certificados referenciados (signing.pfx, encryption.pfx, https-dev.pfx) devem
# ser gerados localmente (ex.: dotnet dev-certs / openssl) e nunca versionados.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: authentication
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: AuthenticationDb
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentication -d AuthenticationDb"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Development (em vez de Production) para que o DevelopmentSeed cadastre
      # automaticamente o client OAuth "spa-client" usado pelo AuthenticationReact,
      # e para que os certificados de signing/encryption do OpenIddict sejam
      # efêmeros (gerados em memória) em vez de exigir signing.pfx/encryption.pfx.
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__AppDb: "Host=postgres;Port=5432;Database=AuthenticationDb;Username=authentication;Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/run/secrets/certs/https-dev.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${ASPNETCORE_Kestrel__Certificates__Default__Password}
    volumes:
      - ./certs:/run/secrets/certs:ro
    ports:
      - "8080:8080"
      - "8443:8443"

  web:
    build:
      context: ../AuthenticationReact
      dockerfile: Dockerfile.dev
    depends_on:
      - api
    environment:
      # O navegador acessa esses endpoints via localhost (portas publicadas),
      # não pelo nome do serviço Docker — o fluxo OAuth é feito de navegação
      # completa do browser do host, não de container para container.
      VITE_API_BASE_URL: "https://localhost:8443"
      VITE_OIDC_CLIENT_ID: "spa-client"
      VITE_OIDC_REDIRECT_URI: "https://localhost:5173/callback"
      VITE_OIDC_SCOPE: "openid email profile offline_access"
      # Dentro do container não há Keychain do host para confiar na CA do mkcert;
      # reaproveitamos os certificados já gerados/confiados no host (ver README).
      SKIP_MKCERT: "1"
    volumes:
      - ../AuthenticationReact:/app
      - /app/node_modules
      - ../AuthenticationReact/.certs:/app/.certs:ro
    ports:
      - "5173:5173"

volumes:
  postgres-data:
